name: Update my IPTV playlist
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Download upstream playlist
        run: curl -L --fail --retry 3 -o /tmp/index.m3u https://iptv-org.github.io/iptv/index.m3u
      - name: Build curated playlist
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mytv.m3u
          git diff --cached --quiet || git commit -m 'Auto update IPTV playlist'
          git push
